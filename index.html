<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>Forme</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Repas</h1>
    <div id="date-nav" class="date-nav">
      <button id="prev-day" aria-label="Jour précédent">‹</button>
      <input type="date" id="current-date">
      <button id="next-day" aria-label="Jour suivant">›</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-view="repas" class="active"><span>🍽</span>Repas</button>
    <button data-view="sport"><span>🏋</span>Sport</button>
    <button data-view="suivi"><span>📈</span>Suivi</button>
    <button data-view="objectifs"><span>🎯</span>Objectifs</button>
    <button data-view="aliments"><span>🥫</span>Aliments</button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>

  <script src="data/aliments-perso.js"></script>
  <script src="js/db.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
